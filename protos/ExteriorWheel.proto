# omnidirectionnal wheel with 2D coulomb friction

EXTERNPROTO "WheelMesh.proto"
EXTERNPROTO "SubWheelMesh.proto"

PROTO ExteriorWheel [
  field SFVec3f translation 0 0 0
  field SFVec3f anchor 0 0 0
  field SFString name "wheel"
  field SFString sensorName "wheel_sensor"
]
{
  HingeJoint {
    device [
      # ── WHEEL DYNAMICS ARE LIMITED IN THE BRIDGE, NOT HERE ─────────────────────────────────────
      # ⚠ DO NOT add an `acceleration` field to these wheel motors. Webots' RotationalMotor carries
      #   ONE SYMMETRIC number, but the real base accelerates at 0.35-0.50 m/s^2 and brakes at 1.00,
      #   so the field cannot express it. The ramp lives where the real driver's does — webots-bridge
      #   apply_pending_speed_command(), fed from SVD48VBase's own config (SVD48V.py:129-130 is the
      #   original). Adding it here would COMPOSE with that ramp: the sim would then accelerate more
      #   slowly than either the hardware or the number written here.
      # ⚠ DO NOT lower `maxVelocity` to maxLinSpeed/wheelRadius. It is a PER-WHEEL bound while the
      #   real limits are per-AXIS of the twist, and a LEGAL twist can demand more wheel speed than
      #   v_max/r: worst legal case is 21.95 rad/s (P3Bot, at advz 0.7 + advx 0.7 + rot 1.5) and
      #   14.18 (Shadow). Both are under 30, so once the bridge clips the twist this never binds.
      #   Capping it at 8.75 would silently distort every combined motion — a NEW sim2real error
      #   introduced while closing one.
      # The twist clamp itself mirrors SVD48VBase/src/specificworker.py:161-173.
      RotationalMotor {
        name IS name
        maxVelocity 14.81
      }
      PositionSensor {
        name IS sensorName
      }
    ]
    jointParameters HingeJointParameters {
      axis 0 1 0
      anchor IS anchor
    }
    endPoint DEF WHEEL_SOLID Solid {
      translation IS translation
      children [
        WheelMesh {
        }
        Pose {
          translation 0 0 0.036
          rotation 0 0 -1 0.785402
          children [
            SubWheelMesh {
            }
          ]
        }
        Pose {
          translation 0.0311 0 0.018
          rotation -0.318977 0.770074 -0.552484 1.28666
          children [
            SubWheelMesh {
            }
          ]
        }
        Pose {
          translation 0.0311 0 -0.018
          rotation -0.373673 0.902122 -0.21574 2.18123
          children [
            SubWheelMesh {
            }
          ]
        }
        Pose {
          translation 0 0 -0.036
          rotation -0.382685 0.923879 0 3.14159
          children [
            SubWheelMesh {
            }
          ]
        }
        Pose {
          translation -0.0311 0 -0.018
          rotation -0.373673 0.902122 0.21574 4.10195
          children [
            SubWheelMesh {
            }
          ]
        }
        Pose {
          translation -0.0311 0 0.018
          rotation -0.318977 0.770074 0.552484 4.99652
          children [
            SubWheelMesh {
            }
          ]
        }
      ]
      name IS name
      contactMaterial "ExteriorWheelMat"
      boundingObject Pose {
        rotation 1 0 0 -1.5708
        children [
          Cylinder {
            height 0.072
            radius 0.05
            subdivision 24
          }
        ]
      }
      physics Physics {
        density -1
        mass 0.4
      }
    }
  }
}
