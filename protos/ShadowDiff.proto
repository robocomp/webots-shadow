#VRML_SIM R2023b utf8

EXTERNPROTO "BodyMesh.proto"

PROTO ShadowDiff [
  field SFVec3f           translation     0 0 0.033         # Is `Pose.translation`.
  field SFRotation        rotation        0 0 0 0      # Is `Pose.rotation`.
  field SFString          name            "shadow"      # Is `Solid.name`.
  field SFString          controller      "<extern>"      # Is `Robot.controller`.
  field SFBool            synchronization TRUE            # Is `Robot.synchronization`. FALSE ⇒ async (real-time) so this robot doesn't gate the sim when multiple extern controllers share a world.
]
{
Robot {
  translation IS translation
  rotation IS rotation
  name IS name
  model "ROBOLAB shadow"
  children [
    Group {
      children [
        Shape {
          appearance PBRAppearance {
            baseColor 0.870588 0.866667 0.854902
            roughness 1
            metalness 0.3
          }
          geometry Mesh {
            url [
              "../protos/meshes/shadow.stl"
            ]
          }
        }
      ]
    }
    Group {
      children [
        Group {
          children [
            Camera {
              translation 0 -0.17 1.275
              rotation 0 0 1 -1.5707953071795862
              name "camera_360_2"
              fieldOfView 3.14
              width 960
              height 960
              projection "cylindrical"
            }
            Camera {
              translation 0 -0.17 1.275
              rotation 0 0 -1 -1.5708053071795867
              name "camera_360_1"
              fieldOfView 3.14
              width 960
              height 960
              projection "cylindrical"
            }
          ]
        }
        Lidar {
          translation 0 -0.155 1.075
          # ── MOUNTED UPSIDE DOWN, ON PURPOSE ──────────────────────────────────────────────────
          # 2026-08-29: was `rotation 0 0 1 -4.7116` (yaw only, sensor upright). Shadow carries the
          # helios INVERTED so the wide part of its fan points UP: the H32F70 is asymmetric about its
          # own horizon (-54.5..+15.5), and hanging it upside down turns that into +54.5..-15.5 in the
          # body frame. What it buys is the UPPER WALLS — from 1.075 m the top beam reaches 2.48 m of
          # wall height at 1 m range and 3.88 m at 2 m — which is high-contrast, permanent structure and
          # far better localisation geometry than the floor. What it costs is the near floor: the fan
          # now only reaches down 15.5 deg, so the floor is first hit at 3.88 m instead of 0.77 m. That
          # near-floor band is the BPEARL's job (it hangs inverted at 0.67 m for exactly this reason),
          # so the two sensors now have IDENTICAL orientation and differ only in height.
          #
          # ★THE ENCODING, because a 180 deg flip has two equally valid axes and only one keeps the
          # yaw: this is Rz(+90 deg) * Rx(180 deg) — the SAME bracket yaw as before, sensor inverted
          # about its own x. As axis-angle that is (1,1,0) by 180 deg, which is bit-identical to the
          # rotation the bpearl node already carries: two upside-down lidars, one encoding.
          # ★-4.7116 was -3pi/2 rounded, 0.045 deg shy of a right angle. The clean axis-angle removes
          # that stray 0.8 mrad, which is why the yaw is now exactly 90 and not 90.045.
          # ★THE MOUNT INVARIANT still holds and is what keeps consumers correct (ROBOT_GEOMETRY.md):
          # R_json = R_proto * Rz(-90 deg), the -90 being the device->canonical swap lidar3d_dds
          # applies at specificworker.cpp:530. With R_proto = Rz(90)Rx(180) that gives R_json = Ry(180),
          # so shadow.json's body<-helios RT edge reads euler_xyz (0, pi, 0) — updated in the same
          # commit. Change one without the other and every consumer's cloud is upside down.
          rotation 1 1 0 3.14159265359
          name "helios"
          # ── THE SENSOR IS AN RS-Helios H32F70, AND THE SPAN BELOW MUST SAY SO ──────────────────
          # ★★★2026-08-29: verticalFieldOfView was pi (180 deg) with 82 layers and tiltAngle -0.
          # That is not a Helios, and it is not conservative — it is a sensor that can see STRAIGHT
          # DOWN, so every near-field behaviour validated in this world was validated against
          # visibility the real robot does not have. The H32F70 spans -55..+15 deg: 70 deg of
          # vertical FOV in 32 beams, centred at -20.
          #
          # This is the SAME fix P3Bot.proto took on 2026-08-27, arriving here two days late. It was
          # found from the other end: lidar3d_dds advertises this geometry on the `helios` DSR node
          # (etc/config_helios_webots.toml [SensorModel]), and that block had been filled in with
          # P3Bot's already-corrected numbers — 32 beams over 70 deg — while THIS proto still emitted
          # 82 over 180. The channel meant to end "two sources of truth for one physical fact" was
          # itself the second source. The config now describes whatever this file says; the two move
          # together or the graph lies.
          #
          # ★TWO OF THE THREE NUMBERS WERE ALREADY RIGHT, WHICH IS WHY THIS IS A THREE-TOKEN CHANGE:
          #   angular resolution  sim 180/82 = 2.20 deg/layer   vs real 70/32 = 2.19   -> already right
          #   span                180 deg                       vs 70                  -> WRONG
          #   tilt                0                             vs the -20 centre      -> WRONG
          # (P3Bot only had the span wrong; its tilt was already -0.34. Here BOTH were, so the beams
          # removed are not only the ones below -55 deg — the whole fan also rotates down by 19.5.)
          #
          # ★WHAT THIS COSTS, AND IT IS MEANT TO. With the sensor at 1.075 m, a target of height h is
          # invisible to THIS sensor inside r = (1.075 - h)/tan(54.48 deg):
          #     h = 0    -> 0.77 m     h = 0.25 -> 0.59 m     h = 0.45 -> 0.45 m     h = 0.75 -> 0.23 m
          # Low objects will now VANISH from the helios cloud on the final approach, as they do on the
          # real robot. Shadow is better off than P3Bot here and the reason is real, not luck: it
          # carries the bpearl downward dome at 0.67 m, whose entire job is the near field this ring
          # cannot reach. That makes the blind ring a BPEARL COVERAGE QUESTION, not an unobservable
          # one — and it is now posed honestly instead of being answered by a helios that looked at
          # its own feet. Verify the dome actually covers 0.33..0.77 m before trusting it.
          # ⚠Do not "fix" a near-field regression by widening this back out. That hides the defect in
          # the one place it is cheap to reproduce.
          tiltAngle -0.34                    # -19.5 deg, the H32F70's -20 centre. Was -0.
          horizontalResolution 900
          fieldOfView 6.28
          verticalFieldOfView 1.2217304764   # 70 deg (H32F70). Was pi. With tilt -0.34: -54.5..+15.5
          numberOfLayers 32                  # was 82
          maxRange 100
          noise 0.005
          defaultFrequency 20
        }
        Lidar {
          translation 0 0.14 0.67
          rotation -1 -1 0 3.14159
          # children [
            # Shape {
              # appearance DEF BlackMetalAppearance PBRAppearance {
                # baseColor 0 0 0
                # roughness 0.5
                # name "BlackMetal"
              # }
              # geometry Cylinder {
                # height 0.01
                # radius 0.05
              # }
            # }
          # ]
          name "bpearl"
          horizontalResolution 875
          fieldOfView 6.28
          verticalFieldOfView 3.141592653589793
          numberOfLayers 64
          maxRange 100
          noise 0.005
          defaultFrequency 20
        }
        Accelerometer {
          resolution 0.001
        }
        Gyro{}

          Camera {
                  translation 0.0 -0.075 0.945
                  rotation 0 0 1 1.57

                  children[
                    RangeFinder{
                      name "zed-ranger"
                      fieldOfView 1.9198 
                      width 1280
                      height 720
                      #fieldOfView 2.09
                      #width 1920
                      #height 1080
                      maxRange 100
                    }
                     # Shape {
                          # geometry Box
                          # {
                            # size 0.04 0.17 0.03
                          # }
                         # }
                      ]

                  name "zed"
                  fieldOfView 1.9198
                  width 1280
                  height 720
                  #fieldOfView 2.09
                  #width 1920
                  #height 1080
                  projection "planar"
            }
    ]}

    # ==== DIFFERENTIAL RUNNING GEAR ==================================================
    # Two drive wheels on the lateral axis plus front and back casters, matching the real Shadow.
    # Geometry is taken from the robot's own driver config, not invented:
    #   SVD48VBase/etc/config_diferential -> wheelRadius = 100 mm, axesLength = 518 mm
    # so R = 0.1 and the half-track is 0.259 (axesLength/2, which is what that component's 2x2
    # m_wheels matrix uses). The bridge's differential kinematics must use those same two numbers.
    #
    # The body and EVERY sensor above are byte-identical to Shadow.proto, and the axle height is set
    # to R - 0.033 = 0.067 so the chassis sits at exactly the height it did with the 50 mm
    # mecanum wheels. That keeps all lidar and camera extrinsics valid -- changing them would have a
    # far larger blast radius than the wheels themselves.
    #
    # The drive wheels sit at |x| = 0.259, outside the body's 0.44-wide boundingObject, so they
    # protrude ~2 cm per side exactly as on the real robot and never interpenetrate the chassis.
    # LEFT drive wheel. Axis -1 0 0 and a +90 deg z-rotation on the endPoint keep the
    # SAME conventions the mecanum Shadow used, so a positive motor velocity still drives forward
    # (+y) and the bridge's sign handling is unchanged.
    DEF WHEEL_LEFT HingeJoint {
      jointParameters HingeJointParameters {
        position 0
        axis -1 0 0
        anchor -0.259 0 0.067
      }
      device [
        RotationalMotor {
          name "wheel_left"
          maxVelocity 30
        }
        PositionSensor {
          name "wheel_leftsensor"
        }
      ]
      endPoint Solid {
        translation -0.259 0 0.067
        rotation 0 0 1 1.5708
        children [
          # A Webots Cylinder is aligned with its local Z. Getting a WHEEL out of that needs two
          # rotations, composed exactly as the mecanum Shadow does it:
          #   Cylinder Z --(Pose: R_x -90)--> Y --(Solid: R_z +90)--> -X, the lateral axle.
          # Applying only the Solid's rotation leaves the cylinder on Z and the wheel lies flat on
          # the floor like a pancake, which is what happened the first time.
          Pose {
            rotation 1 0 0 -1.5708
            children [
              Shape {
                appearance PBRAppearance {
                  baseColor 0.12 0.12 0.12
                  roughness 0.7
                  metalness 0
                }
                geometry Cylinder {
                  height 0.05
                  radius 0.1
                  subdivision 32
                }
              }
            ]
          }
        ]
        name "wheel_left_solid"
        contactMaterial "DriveWheelMat"
        boundingObject Pose {
          rotation 1 0 0 -1.5708
          children [
            Cylinder {
              height 0.05
              radius 0.1
              subdivision 24
            }
          ]
        }
        physics Physics {
          density -1
          mass 2
        }
      }
    }
    # RIGHT drive wheel. Axis -1 0 0 and a +90 deg z-rotation on the endPoint keep the
    # SAME conventions the mecanum Shadow used, so a positive motor velocity still drives forward
    # (+y) and the bridge's sign handling is unchanged.
    DEF WHEEL_RIGHT HingeJoint {
      jointParameters HingeJointParameters {
        position 0
        axis -1 0 0
        anchor 0.259 0 0.067
      }
      device [
        RotationalMotor {
          name "wheel_right"
          maxVelocity 30
        }
        PositionSensor {
          name "wheel_rightsensor"
        }
      ]
      endPoint Solid {
        translation 0.259 0 0.067
        rotation 0 0 1 1.5708
        children [
          # A Webots Cylinder is aligned with its local Z. Getting a WHEEL out of that needs two
          # rotations, composed exactly as the mecanum Shadow does it:
          #   Cylinder Z --(Pose: R_x -90)--> Y --(Solid: R_z +90)--> -X, the lateral axle.
          # Applying only the Solid's rotation leaves the cylinder on Z and the wheel lies flat on
          # the floor like a pancake, which is what happened the first time.
          Pose {
            rotation 1 0 0 -1.5708
            children [
              Shape {
                appearance PBRAppearance {
                  baseColor 0.12 0.12 0.12
                  roughness 0.7
                  metalness 0
                }
                geometry Cylinder {
                  height 0.05
                  radius 0.1
                  subdivision 32
                }
              }
            ]
          }
        ]
        name "wheel_right_solid"
        contactMaterial "DriveWheelMat"
        boundingObject Pose {
          rotation 1 0 0 -1.5708
          children [
            Cylinder {
              height 0.05
              radius 0.1
              subdivision 24
            }
          ]
        }
        physics Physics {
          density -1
          mass 2
        }
      }
    }
    # Front ball caster, on a BallJoint so it is free to rotate about all three axes --
    # which is what makes it a caster rather than a skid. The first version bolted the sphere rigidly
    # to the chassis; it could not roll, so it dragged, and the only way to stop it fighting a pivot
    # was a friction so low (0.05) that nothing damped the fore/aft rocking. A rolling ball needs no
    # such trick: it takes ordinary friction and simply follows the chassis.
    #
    # A BallJoint is also deliberately preferred over a modelled swivel castor (a vertical hinge plus
    # a wheel hinge): the swivel can jitter or lock under load, and that noise would land straight in
    # the wheel-odometry measurements this base exists to make clean.
    DEF CASTER_FRONT BallJoint {
      jointParameters BallJointParameters {
        anchor 0 0.18 0.007
      }
      endPoint Solid {
        translation 0 0.18 0.007
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.25 0.25 0.25
              roughness 0.4
              metalness 0.3
            }
            geometry Sphere {
              radius 0.04
              subdivision 3
            }
          }
        ]
        name "caster_front"
        contactMaterial "CasterMat"
        boundingObject Sphere {
          radius 0.04
          subdivision 3
        }
        physics Physics {
          density -1
          mass 0.2
        }
      }
    }
    # Back ball caster, on a BallJoint so it is free to rotate about all three axes --
    # which is what makes it a caster rather than a skid. The first version bolted the sphere rigidly
    # to the chassis; it could not roll, so it dragged, and the only way to stop it fighting a pivot
    # was a friction so low (0.05) that nothing damped the fore/aft rocking. A rolling ball needs no
    # such trick: it takes ordinary friction and simply follows the chassis.
    #
    # A BallJoint is also deliberately preferred over a modelled swivel castor (a vertical hinge plus
    # a wheel hinge): the swivel can jitter or lock under load, and that noise would land straight in
    # the wheel-odometry measurements this base exists to make clean.
    DEF CASTER_BACK BallJoint {
      jointParameters BallJointParameters {
        anchor 0 -0.18 0.007
      }
      endPoint Solid {
        translation 0 -0.18 0.007
        children [
          Shape {
            appearance PBRAppearance {
              baseColor 0.25 0.25 0.25
              roughness 0.4
              metalness 0.3
            }
            geometry Sphere {
              radius 0.04
              subdivision 3
            }
          }
        ]
        name "caster_back"
        contactMaterial "CasterMat"
        boundingObject Sphere {
          radius 0.04
          subdivision 3
        }
        physics Physics {
          density -1
          mass 0.2
        }
      }
    }
  ]
  name "shadow"
  description "ROBOLAB shadow"
  boundingObject Group {
    children [
      Pose {
        translation 0 0 0.38
        children [
          Box {
            size 0.44 0.46 0.76
          }
        ]
      }
      Pose {
        translation 0 -0.17 1.03
        children [
          Box {
            size 0.1 0.1 0.61
          }
        ]
      }
    ]
  }
  physics Physics {
    density -1
    mass 50
    centerOfMass [
      0 0 -0.045
    ]
    inertiaMatrix [
      0.418086 0.166204 0.55459
      0 0 0
    ]
  }
  controller IS controller
  synchronization IS synchronization
  supervisor TRUE
  linearVelocity 2.5768635962415814e-15 -4.075325935301325e-16 0
  angularVelocity 3.318708717389001e-16 -7.061550565025133e-16 3.5130543371496327e-15
  }
}
